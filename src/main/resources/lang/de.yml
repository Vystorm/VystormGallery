# /vgallery über Vystorm Core: Beschreibung, Hilfe und Tab-Vervollständigung je Spieler. "aliases" unter
# commands.vgallery sind zusätzliche Hauptbefehle (serverweit, der Admin wählt die Sprachen: Core-Konfig
# commands.localized-aliases); "name" und "aliases" eines Unterbefehls werden in jeder Sprache verstanden, Englisch geht immer.
playlist-empty: "<gray>Keine Motivliste: Die Diashow nutzt alle erlaubten Motive."
playlist-list: "<gold>Motivliste ({count}): <yellow>{motifs}"
playlist-cleared: "<green>Motivliste geleert. Die Diashow nutzt wieder alle erlaubten Motive."
playlist-duplicate: "<gray>Dieses Motiv ist bereits in der Liste."
playlist-full: "<red>Höchstens {max} Motive pro Liste."
playlist-added: "<green>Aktuelles Motiv an die Liste angehängt."
playlist-missing: "<gray>Das aktuelle Motiv steht nicht in der Liste."
playlist-removed: "<green>Aktuelles Motiv entfernt. Eine leere Liste nutzt alle erlaubten Motive."

commands:
  vgallery:
    description: "Gemälde: Motivmenü, Zufallsmotiv, Motiv nach Name, Sperre und Diashow"
    aliases: [gemaelde, gemälde]
    args:
      motif: MOTIV
    sub:
      album:
        name: album
        aliases: []
        description: "Dein Motiv-Album: gesammelte Gemälde nach Größe"
      exhibitions:
        name: exhibitions
        aliases: []
        description: "Gemälde zu Ausstellungen zusammenstellen und Favoriten wählen."
        args:
          action: ACTION
      menu:
        name: menü
        aliases: [menue]
        description: "Motivmenü des Gemäldes, das du ansiehst"
      random:
        name: zufall
        aliases: [zufällig]
        description: "Ein zufälliges Motiv, das an die Wand passt"
      undo:
        name: rückgängig
        aliases: []
        description: "Deinen letzten Motivwechsel am angesehenen Gemälde rückgängig machen"
      lock:
        name: sperren
        aliases: [sperre]
        description: "Gemälde sperren oder entsperren: nur du kannst es ändern oder abbauen"
      slideshow:
        name: diashow
        aliases: []
        description: "Diashow auf dem Gemälde starten oder beenden (z. B. 30 oder 5m; aus beendet sie)"
        args:
          interval: "SEKUNDEN|aus"
      playlist:
        name: motivliste
        aliases: []
        description: "Motivliste für die Diashow dieses Gemäldes verwalten"
        sub:
          add:
            name: hinzufügen
            aliases: []
            description: "Aktuelles Motiv anhängen"
          remove:
            name: entfernen
            aliases: []
            description: "Aktuelles Motiv entfernen"
          clear:
            name: leeren
            aliases: []
            description: "Wieder alle Motive verwenden"
          first:
            name: anfang
            aliases: []
            description: "Aktuelles Motiv an den Anfang verschieben"
          last:
            name: ende
            aliases: []
            description: "Aktuelles Motiv ans Ende verschieben"
          list:
            name: anzeigen
            aliases: []
            description: "Gespeicherte Motivreihenfolge anzeigen"
      reload:
        name: neuladen
        aliases: []
        description: "Konfiguration und Sprachdateien neu laden"

playlist-first: "<green>Aktuelles Motiv an den Anfang der Motivliste verschoben."
playlist-last: "<green>Aktuelles Motiv ans Ende der Motivliste verschoben."

