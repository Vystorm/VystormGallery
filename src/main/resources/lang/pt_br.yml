menu-lock: <yellow>Travando a pintura
menu-lock-lore: '<gray>Clique: só você pode mudar ou quebrar'
menu-locked: <gold>Travado por {owner}
menu-unlock-lore: <gray>Clique para desbloquear
menu-locked-lore: <gray>Só o dono pode destravá-lo
menu-slideshow-off: <yellow>Iniciar apresentação de slides
menu-slideshow-off-lore: '<gray>Click esquerdo: novo motivo a cada {time} · Botão direito: {next}'
menu-slideshow-on: '<gold>Slideshow: a cada {time}'
menu-slideshow-on-lore: '<gray>Clique com o botão esquerdo: {next}'
menu-name-favourite: <gold>★ {art}
menu-favourite-add: '<gray>Shift-click: marque como favorito'
menu-favourite-remove: <yellow>★ Favorito <gray>- Mude de clique para remover
favourite-added: <gold>★ <yellow>{art}</yellow> é agora um favorito - mostrado primeiro no menu de motivos.
favourite-removed: <gray>{art} não é mais um favorito.
favourite-full: <red>No máximo {max} motivos favoritos.
undo-empty: <gray>Nenhuma mudança para desfazer neste quadro. Olhe o quadro que você mudou pela última vez.
undo-unavailable: <red>O motivo anterior não é mais permitido pelas configurações atuais.
undo-restored: '<green>Pintura restaurada: <yellow>{art}'
playlist-empty: '<gray>Sem playlist: a apresentação usa todos os motivos permitidos.'
playlist-list: '<gold>Lista de reprodução ({count}): <yellow>{motifs}'
playlist-cleared: <green>Lista de reprodução liberada. O slideshow usa todos os motivos permitidos novamente.
playlist-duplicate: <gray>Este motivo já está na playlist.
playlist-full: <red>No máximo {max} motivos por playlist.
playlist-added: <green>Motivo atual anexado à lista de reprodução.
playlist-missing: <gray>O motivo atual não está na lista.
playlist-removed: <green>Motivo atual removido. Uma playlist vazia usa todos os motivos permitidos.
commands:
  vgallery:
    description: 'Pinturas: menu de motivos, motivo aleatório, motivo pelo nome, bloqueio e slideshow'
    aliases: []
    args:
      motif: MOTIF
    sub:
      album:
        name: album
        aliases: []
        description: "Seu álbum de motivos: pinturas coletadas por tamanho"
      exhibitions:
        name: exhibitions
        aliases: []
        description: "Organize pinturas em exposições e vote nas favoritas."
        args:
          action: ACTION
      menu:
        name: menu
        aliases: []
        description: Menu Motif da pintura que você olha
      random:
        name: random
        aliases: []
        description: Um motivo aleatório que se encaixa na parede
      undo:
        name: undo
        aliases: []
        description: Desfaça sua última mudança na pintura que você olha
      lock:
        name: lock
        aliases: []
        description: 'Tranque ou desbloqueie o quadro: só você pode mudar ou quebrar'
      slideshow:
        name: slideshow
        aliases: []
        description: Comece ou pare uma apresentação na pintura (e.g. 30 ou 5m; fora pára)
        args:
          interval: SECONDS off
      playlist:
        name: playlist
        aliases: []
        description: Gerencie a lista de slides desta pintura
        sub:
          add:
            name: add
            aliases: []
            description: Anexe o motivo atual
          remove:
            name: remove
            aliases: []
            description: Remova o motivo atual
          clear:
            name: clear
            aliases: []
            description: Use todos os motivos novamente
          first:
            name: first
            aliases: []
            description: Mova o motivo atual para o início
          last:
            name: last
            aliases: []
            description: Mova o motivo atual para o fim
          list:
            name: list
            aliases: []
            description: Mostre o motivo salvo
      reload:
        name: reload
        aliases: []
        description: Recarregar arquivos de configuração e linguagem
playlist-first: <green>Motivo atual movido para o início da playlist.
playlist-last: <green>O motivo atual foi para o final da lista.

