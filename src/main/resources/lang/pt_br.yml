locked: <green>Pintura trancada. Só você pode mudar ou quebrar agora.
unlocked: <gray>Pintura destrancada.
locked-by: <red>Esta pintura está trancada por <yellow>{owner}</yellow>.
feature-off: "<gray>Este recurso está desligado neste servidor."
