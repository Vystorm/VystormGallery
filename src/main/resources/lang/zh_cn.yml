# 通过 Vystorm Core 提供的 /vgallery：每位玩家看到自己语言的说明、帮助和 Tab 补全。commands.vgallery 下的 "aliases"
# 是额外的主命令（全服生效，由管理员在 Core 配置 commands.localized-aliases 中选择语言）；子命令的 "name" 和
# "aliases" 在所有语言中都可使用，英文始终有效。
playlist-empty: "<gray>没有播放列表：幻灯片使用所有允许的图案。"
playlist-list: "<gold>播放列表（{count}）：<yellow>{motifs}"
playlist-cleared: "<green>播放列表已清空。幻灯片重新使用所有允许的图案。"
playlist-duplicate: "<gray>此图案已在播放列表中。"
playlist-full: "<red>每个播放列表最多包含 {max} 个图案。"
playlist-added: "<green>已将当前图案添加到播放列表末尾。"
playlist-missing: "<gray>当前图案不在播放列表中。"
playlist-removed: "<green>已移除当前图案。空列表使用所有允许的图案。"

commands:
  vgallery:
    description: "画作：图案菜单、随机图案、按名称选择图案、锁定和幻灯片"
    aliases: [画廊]
    args:
      motif: 图案
    sub:
      album:
        name: album
        aliases: []
        description: "你的画作图鉴：按尺寸收集的画"
      exhibitions:
        name: exhibitions
        aliases: []
        description: "将画作组成展览并为喜爱的展览投票。"
        args:
          action: ACTION
      menu:
        name: 菜单
        aliases: []
        description: "你所看着的画的图案菜单"
      random:
        name: 随机
        aliases: []
        description: "随机换一幅适合墙面的图案"
      undo:
        name: 撤销
        aliases: []
        description: "撤销你对所看画作的最后一次图案更改"
      lock:
        name: 锁定
        aliases: []
        description: "锁定或解锁这幅画：只有你能更改或拆除它"
      slideshow:
        name: 幻灯片
        aliases: []
        description: "在画上开始或停止幻灯片（例如 30 或 5m；关 可停止）"
        args:
          interval: "秒数|关"
      playlist:
        name: 播放列表
        aliases: []
        description: "管理这幅画的幻灯片播放列表"
        sub:
          add:
            name: 添加
            aliases: []
            description: "将当前图案添加到末尾"
          remove:
            name: 移除
            aliases: []
            description: "移除当前图案"
          clear:
            name: 清空
            aliases: []
            description: "重新使用所有图案"
          first:
            name: 置顶
            aliases: []
            description: "将当前图案移至开头"
          last:
            name: 置底
            aliases: []
            description: "将当前图案移至末尾"
          list:
            name: 查看
            aliases: []
            description: "查看保存的图案顺序"
      reload:
        name: 重载
        aliases: []
        description: "重新加载配置和语言文件"

playlist-first: "<green>已将当前图案移至播放列表开头。"
playlist-last: "<green>已将当前图案移至播放列表末尾。"

