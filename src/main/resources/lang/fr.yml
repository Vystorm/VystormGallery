# Français — UTF-8. Keep keys, placeholders and formatting tokens unchanged.
scroll-hint: <gold>Faites défiler pour retourner à travers <yellow>{count}</yellow> motifs <gray>– clic droit pour garder
changed: <gold>🖼 <yellow>{art}</yellow> <gray>{size} · {pos}/{total}
kept: '<green>Peinture conservée : <yellow>{art}'
ended: <gray>La sélection de peinture a pris fin.
no-options: <gray>Aucun autre motif ne convient ici.
denied: <red>Vous n'avez pas la permission pour ça.
reloaded: <green>Vystorm Galerie rechargée (des motifs {count} connus).
usage: <gray>/{label} [menu] randomisé (motif name)
brush-lore: '<gray>Motif : <yellow>{art}</yellow> – clic droit sur une peinture à appliquer'
brush-copied: <green>Porte-brosse <yellow>{art}</yellow>. Faites un clic droit sur une autre peinture pour l'appliquer.
