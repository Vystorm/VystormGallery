menu-previous: <yellow>« Page {page}/{pages}
menu-next: <yellow>Page {page}/{pages} »
unknown-motif: <red>Pas de motif <yellow>{name}</yellow> Ici. <gray>Onglet complète les noms.
locked: <green>Peinture verrouillée. Seul vous pouvez le changer ou le casser maintenant.
unlocked: <gray>Peinture déverrouillée.
locked-by: <red>Cette peinture est verrouillée par <yellow>{owner}</yellow>.
feature-off: "<gray>Cette fonctionnalité est désactivée sur ce serveur."
slideshow-on: '<green>Diaporama commencé: un nouveau motif chaque <yellow>{time}</yellow>.'
slideshow-off: <gray>Le diaporama s'est arrêté.
slideshow-usage: <gray>/{label} diaporama (secondes, e.g. 30 ou 5m)
menu-lock: <yellow>Verrouiller la peinture
menu-lock-lore: '<gray>Cliquez sur : vous seul pouvez le modifier ou le casser'
menu-locked: <gold>Verrouillé par {owner}
menu-unlock-lore: <gray>Cliquez pour débloquer
menu-locked-lore: <gray>Seul le propriétaire peut le déverrouiller
menu-slideshow-off: <yellow>Démarrer le diaporama
menu-slideshow-off-lore: '<gray>Clic-gauche : nouveau motif tous les {time} · clic-droit : {next}'
menu-slideshow-on: '<gold>Diaporama : tous les {time}'
menu-slideshow-on-lore: '<gray>Cliquez-gauche : stop · clic-droit : tous les {next}'
menu-name-favourite: <gold>★ {art}
menu-favourite-add: '<gray>Maj-clic : marque comme favori'
menu-favourite-remove: <yellow>★ Favoris <gray>– cliquez sur le bouton pour supprimer
favourite-added: <gold>★ <yellow>{art}</yellow> est maintenant un favori – montré en premier dans le menu motif.
favourite-removed: <gray>{art} n'est plus un favori.
favourite-full: <red>Au plus {max} motifs préférés.
undo-empty: <gray>Pas de changement à annuler sur ce tableau. Regardez le tableau que vous avez changé pour la dernière fois.
undo-unavailable: <red>Le motif précédent n'est plus autorisé par les paramètres actuels.
undo-restored: '<green>Peinture restaurée : <yellow>{art}'
playlist-empty: '<gray>Pas de playlist : le diaporama utilise tous les motifs autorisés.'
playlist-list: '<gold>Liste de lecture ({count}): <yellow>{motifs}'
playlist-cleared: <green>La liste de lecture est vide. Le diaporama utilise à nouveau tous les motifs autorisés.
playlist-duplicate: <gray>Ce motif est déjà dans la playlist.
playlist-full: <red>Au plus {max} motifs par playlist.
playlist-added: <green>Motif actuel annexé à la liste de lecture.
playlist-missing: <gray>Le motif actuel n'est pas dans la liste de lecture.
playlist-removed: <green>Motif actuel enlevé. Une playlist vide utilise tous les motifs autorisés.
commands:
  vgallery:
    description: 'Peintures : menu motif, motif aléatoire, motif par nom, serrure et diaporama'
    aliases: []
    args:
      motif: MOTIF
    sub:
      album:
        name: album
        aliases: []
        description: "Ton album de motifs : tableaux collectionnés par taille"
      exhibitions:
        name: exhibitions
        aliases: []
        description: "Réunissez des peintures en expositions et votez pour vos préférées."
        args:
          action: ACTION
      menu:
        name: menu
        aliases: []
        description: Menu Motif de la peinture que vous regardez
      random:
        name: random
        aliases: []
        description: Un motif aléatoire qui correspond au mur
      undo:
        name: undo
        aliases: []
        description: Défaire votre dernier motif changer sur la peinture que vous regardez
      lock:
        name: lock
        aliases: []
        description: 'Verrouillez ou déverrouillez la peinture : vous seul pouvez la modifier ou la casser'
      slideshow:
        name: slideshow
        aliases: []
        description: Démarrer ou arrêter un diaporama sur la peinture (e.g. 30 ou 5m; arrêt)
        args:
          interval: SECONDSArrêt
      playlist:
        name: playlist
        aliases: []
        description: Gérer la liste de lecture de ce tableau diaporama
        sub:
          add:
            name: add
            aliases: []
            description: Ajouter le motif actuel
          remove:
            name: remove
            aliases: []
            description: Supprimer le motif actuel
          clear:
            name: clear
            aliases: []
            description: Utilisez à nouveau tous les motifs
          first:
            name: first
            aliases: []
            description: Déplacer le motif actuel au début
          last:
            name: last
            aliases: []
            description: Déplacer le motif actuel à la fin
          list:
            name: list
            aliases: []
            description: Afficher l'ordre de motif enregistré
      reload:
        name: reload
        aliases: []
        description: Recharger les fichiers de configuration et de langue
playlist-first: <green>Le motif actuel a été déplacé au début de la playlist.
playlist-last: <green>Motif actuel déplacé à la fin de la playlist.

