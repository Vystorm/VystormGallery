commands:
  vgallery:
    description: 'Картины: меню мотивов, случайный мотив, мотив по имени, блокировка и слайд-шоу'
    aliases: []
    args:
      motif: MOTIF
    sub:
      album:
        name: album
        aliases: []
        description: "Ваш альбом мотивов: собранные картины по размеру"
      exhibitions:
        name: exhibitions
        aliases: []
        description: "Объединяйте картины в выставки и голосуйте за любимые."
        args:
          action: ACTION
      menu:
        name: menu
        aliases: []
        description: Мотив меню картины, на которую вы смотрите
      random:
        name: random
        aliases: []
        description: Случайный мотив, который подходит к стене
      undo:
        name: undo
        aliases: []
        description: Отмените свой последний мотив на картине, на которую вы смотрите
      lock:
        name: lock
        aliases: []
        description: 'Заблокируйте или разблокируйте картину: только вы можете изменить или сломать ее'
      slideshow:
        name: slideshow
        aliases: []
        description: Начните или остановите слайд-шоу на картине (e.g). 30 или 5 м; остановка
        args:
          interval: SECONDS |off
      playlist:
        name: playlist
        aliases: []
        description: Управляйте плейлистом слайд-шоу этой картины
        sub:
          add:
            name: add
            aliases: []
            description: Добавить текущий мотив
          remove:
            name: remove
            aliases: []
            description: Удалите текущий мотив
          clear:
            name: clear
            aliases: []
            description: Используйте все мотивы снова
          first:
            name: first
            aliases: []
            description: Переместите текущий мотив в начало
          last:
            name: last
            aliases: []
            description: Переместите текущий мотив в конец
          list:
            name: list
            aliases: []
            description: Показать сохраненный мотив
      reload:
        name: reload
        aliases: []
        description: Перезагрузка конфигурационных и языковых файлов
playlist-first: <green>Нынешний мотив переместился в начало плейлиста.
playlist-last: <green>Нынешний мотив переместился в конец плейлиста.

