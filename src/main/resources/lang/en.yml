# /vgallery through Vystorm Core: description, help and tab completion per player. "aliases" under commands.vgallery
# are extra root commands (server-wide, the admin chooses which languages: Core config commands.localized-aliases);
# "name" and "aliases" of a subcommand are accepted in every language, English always works.
playlist-empty: "<gray>No playlist: the slideshow uses all allowed motifs."
playlist-list: "<gold>Playlist ({count}): <yellow>{motifs}"
playlist-cleared: "<green>Playlist cleared. The slideshow uses all allowed motifs again."
playlist-duplicate: "<gray>This motif is already in the playlist."
playlist-full: "<red>At most {max} motifs per playlist."
playlist-added: "<green>Current motif appended to the playlist."
playlist-missing: "<gray>The current motif is not in the playlist."
playlist-removed: "<green>Current motif removed. An empty playlist uses all allowed motifs."

commands:
  vgallery:
    description: "Paintings: motif menu, random motif, motif by name, lock and slideshow"
    aliases: []
    args:
      motif: MOTIF
    sub:
      album:
        name: album
        aliases: []
        description: "Your motif album: collected paintings by size"
      exhibitions:
        name: exhibitions
        aliases: []
        description: "Collect paintings into exhibitions and vote for your favourites."
        args:
          action: ACTION
      menu:
        name: menu
        aliases: []
        description: "Motif menu of the painting you look at"
      random:
        name: random
        aliases: []
        description: "A random motif that fits the wall"
      undo:
        name: undo
        aliases: []
        description: "Undo your last motif change on the painting you look at"
      lock:
        name: lock
        aliases: []
        description: "Lock or unlock the painting: only you can change or break it"
      slideshow:
        name: slideshow
        aliases: []
        description: "Start or stop a slideshow on the painting (e.g. 30 or 5m; off stops it)"
        args:
          interval: "SECONDS|off"
      playlist:
        name: playlist
        aliases: []
        description: "Manage this painting's slideshow playlist"
        sub:
          add:
            name: add
            aliases: []
            description: "Append the current motif"
          remove:
            name: remove
            aliases: []
            description: "Remove the current motif"
          clear:
            name: clear
            aliases: []
            description: "Use all motifs again"
          first:
            name: first
            aliases: []
            description: "Move the current motif to the start"
          last:
            name: last
            aliases: []
            description: "Move the current motif to the end"
          list:
            name: list
            aliases: []
            description: "Show the saved motif order"
      reload:
        name: reload
        aliases: []
        description: "Reload config and language files"

playlist-first: "<green>Current motif moved to the start of the playlist."
playlist-last: "<green>Current motif moved to the end of the playlist."

