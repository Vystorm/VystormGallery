playlist-missing: <gray>Il motivo attuale non è nella playlist.
playlist-removed: <green>Il motivo attuale è stato rimosso. Una playlist vuota utilizza tutti i motivi consentiti.
commands:
  vgallery:
    description: 'Dipinti: menu motivo, motivo casuale, motivo per nome, blocco e presentazione'
    aliases: []
    args:
      motif: MOTIF
    sub:
      album:
        name: album
        aliases: []
        description: "Il tuo album di motivi: dipinti raccolti per dimensione"
      exhibitions:
        name: exhibitions
        aliases: []
        description: "Riunisci dipinti in mostre e vota le tue preferite."
        args:
          action: ACTION
      menu:
        name: menu
        aliases: []
        description: Menù Motif del dipinto si guarda
      random:
        name: random
        aliases: []
        description: Un motivo casuale che si adatta al muro
      undo:
        name: undo
        aliases: []
        description: Annulla il tuo ultimo cambiamento di motivo sul dipinto che guardi
      lock:
        name: lock
        aliases: []
        description: 'Bloccare o sbloccare il dipinto: solo si può cambiare o romperlo'
      slideshow:
        name: slideshow
        aliases: []
        description: Avviare o fermare una presentazione sul dipinto (e.g. 30 o 5m; fuori lo ferma)
        args:
          interval: SECONDS
      playlist:
        name: playlist
        aliases: []
        description: Gestisci la playlist di slideshow di questo dipinto
        sub:
          add:
            name: add
            aliases: []
            description: Appendere il motivo attuale
          remove:
            name: remove
            aliases: []
            description: Rimuovere il motivo attuale
          clear:
            name: clear
            aliases: []
            description: Utilizzare tutti i motivi di nuovo
          first:
            name: first
            aliases: []
            description: Spostare il motivo attuale all'inizio
          last:
            name: last
            aliases: []
            description: Spostare il motivo attuale alla fine
          list:
            name: list
            aliases: []
            description: Mostra l'ordine del motivo salvato
      reload:
        name: reload
        aliases: []
        description: Ricarica file di configurazione e lingua
playlist-first: <green>Il motivo attuale si è spostato all'inizio della playlist.
playlist-last: <green>Il motivo attuale si è spostato alla fine della playlist.

