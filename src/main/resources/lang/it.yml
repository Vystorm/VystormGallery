undo-empty: <gray>Non c'è nessun cambiamento da annullare su questo dipinto. Guarda il dipinto che hai cambiato l'ultima volta.
undo-unavailable: <red>Il motivo precedente non è più consentito dalle impostazioni attuali.
undo-restored: '<green>Pittura restaurata: <yellow>{art}'
playlist-empty: '<gray>Nessuna playlist: la presentazione utilizza tutti i motivi consentiti.'
