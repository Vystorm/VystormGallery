title: 'Галерея'
permission: vystormgallery.use
pages:
  - title: 'Выбор сюжета'
    text: |
      Посмотрите на картину и введите /vgallery (или /gallery), чтобы открыть меню сюжетов.
  - title: 'Замок и слайд-шоу'
    text: |
      Заприте картину, чтобы менять её могли только вы. Слайд-шоу само меняет сюжет, например каждые 30 секунд.
  - title: 'Выставки'
    text: |
      Собирайте картины в выставки, которые другие могут посещать и оценивать.
      Введите /vgallery help, чтобы увидеть все команды.
